<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="adminTitle adminDesc">
  <title id="adminTitle">Dashboard CSV admin panel wireframe</title>
  <desc id="adminDesc">An admin-only Dashboard CSV tab in Control Center with three operations: rename version, import from MLflow, and delete rows. A shared preview table shows affected rows before applying, and every apply writes an S3 backup.</desc>

  <!-- App chrome -->
  <rect x="0" y="0" width="980" height="620" fill="#f0f0f0"/>
  <rect x="0" y="0" width="980" height="22" fill="#fde68a"/>
  <text x="490" y="15" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#78350f">DEVELOPMENT</text>

  <rect x="0" y="22" width="220" height="598" fill="#212427"/>
  <rect x="220" y="22" width="760" height="48" fill="#151515"/>

  <!-- Sidebar brand -->
  <rect x="16" y="38" width="28" height="28" rx="6" fill="#e11d48"/>
  <text x="30" y="57" text-anchor="middle" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">P</text>
  <text x="52" y="49" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">PSAP Control Center</text>
  <text x="52" y="63" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8" fill="#94a3b8">Cluster Management</text>

  <!-- Sidebar nav -->
  <text x="18" y="100" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">Overview</text>
  <text x="18" y="124" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">Clusters</text>
  <text x="18" y="148" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">Reservations</text>
  <text x="18" y="172" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">Calendar</text>
  <text x="18" y="196" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Fournos Dashboard</text>
  <rect x="18" y="184" width="3" height="16" rx="1.5" fill="#73bcf7"/>

  <text x="34" y="220" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9.5" fill="#94a3b8">Jobs</text>
  <text x="34" y="242" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9.5" fill="#94a3b8">Submit</text>
  <text x="34" y="264" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9.5" fill="#94a3b8">CPT Jobs</text>
  <text x="34" y="286" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9.5" fill="#94a3b8">Schedules &amp; Locks</text>
  <text x="34" y="308" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#73bcf7">Dashboard CSV</text>

  <text x="18" y="338" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Results</text>
  <text x="18" y="362" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Settings</text>

  <!-- Top bar -->
  <text x="240" y="51" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Fournos Dashboard</text>
  <rect x="368" y="36" width="76" height="18" rx="9" fill="rgba(255,255,255,0.10)"/>
  <text x="406" y="49" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8" fill="#cbd5e1">Experimental</text>
  <text x="830" y="50" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#cbd5e1">Refresh</text>
  <rect x="880" y="34" width="70" height="22" rx="6" fill="#dc2626"/>
  <text x="915" y="49" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Sign In</text>

  <!-- Content heading -->
  <text x="244" y="92" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Fournos Dashboard / Dashboard CSV</text>
  <text x="244" y="116" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Dashboard CSV</text>
  <text x="244" y="134" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Correct rows in the consolidated dashboard. Preview every change before it writes.</text>
  <rect x="900" y="100" width="56" height="18" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="928" y="113" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#92400e">ADMIN</text>

  <!-- Card 1: Rename -->
  <rect x="244" y="150" width="224" height="190" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="258" y="174" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Rename version</text>
  <text x="258" y="190" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Update the version label for a run.</text>
  <rect x="258" y="202" width="196" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="266" y="218" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" fill="#94a3b8">One dashboard UUID per line</text>
  <text x="266" y="232" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="7.5" fill="#94a3b8">Each line is one run.</text>
  <rect x="258" y="254" width="196" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="266" y="269" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" fill="#94a3b8">New version label</text>
  <rect x="258" y="306" width="64" height="24" rx="5" fill="#1d4ed8"/>
  <text x="290" y="322" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Preview</text>

  <!-- Card 2: Import -->
  <rect x="480" y="150" width="224" height="190" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="494" y="174" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Import from MLflow</text>
  <text x="494" y="190" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Add the rows a run exported to MLflow.</text>
  <rect x="494" y="202" width="196" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="502" y="217" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" fill="#94a3b8">Run ID / URL or dashboard UUID</text>
  <circle cx="499" cy="244" r="4.5" fill="#1d4ed8" stroke="#1d4ed8"/>
  <circle cx="499" cy="244" r="1.8" fill="#ffffff"/>
  <text x="510" y="247" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">Skip existing rows</text>
  <circle cx="499" cy="264" r="4.5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="510" y="267" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">Replace existing rows</text>
  <rect x="494" y="306" width="64" height="24" rx="5" fill="#1d4ed8"/>
  <text x="526" y="322" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Preview</text>

  <!-- Card 3: Delete -->
  <rect x="716" y="150" width="224" height="190" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="730" y="174" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Delete rows</text>
  <text x="730" y="190" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Remove every row for a run.</text>
  <rect x="730" y="202" width="196" height="44" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="738" y="218" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" fill="#94a3b8">One dashboard UUID per line</text>
  <text x="738" y="232" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="7.5" fill="#94a3b8">Each line is one run.</text>
  <text x="730" y="264" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#b42318">Type DELETE to confirm</text>
  <rect x="730" y="272" width="196" height="24" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="730" y="306" width="64" height="24" rx="5" fill="#b42318"/>
  <text x="762" y="322" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Preview</text>

  <!-- Preview panel -->
  <rect x="244" y="360" width="712" height="190" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="260" y="384" font-family="Red Hat Display, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Preview</text>
  <text x="316" y="384" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#64748b">Nothing writes until Apply.</text>

  <text x="260" y="408" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">UUID</text>
  <text x="380" y="408" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">MODEL</text>
  <text x="540" y="408" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">PROFILES</text>
  <text x="630" y="408" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">VERSION</text>
  <text x="760" y="408" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">REQUESTED BY</text>
  <text x="876" y="408" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="700" fill="#64748b">ACTION</text>
  <line x1="260" y1="414" x2="940" y2="414" stroke="#e2e8f0"/>

  <text x="260" y="434" font-family="Menlo, Consolas, monospace" font-size="9" fill="#334155">4f1c9a2e-...</text>
  <text x="380" y="434" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">openai/gpt-oss-120b</text>
  <text x="540" y="434" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">profile5, profile6</text>
  <text x="630" y="434" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">vLLM-0.24.0-benchmark</text>
  <text x="760" y="434" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">aansharm</text>
  <text x="876" y="434" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#15803d">rename 3 rows</text>

  <text x="260" y="458" font-family="Menlo, Consolas, monospace" font-size="9" fill="#334155">8b2d7c11-...</text>
  <text x="380" y="458" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">nvidia/Nemotron-3-Super</text>
  <text x="540" y="458" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">profile5</text>
  <text x="630" y="458" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">vLLM-0.24.0-benchmark</text>
  <text x="760" y="458" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">aansharm</text>
  <text x="876" y="458" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#b42318">delete 2 rows</text>

  <text x="260" y="482" font-family="Menlo, Consolas, monospace" font-size="9" fill="#334155">c3e4f5a6-...</text>
  <text x="380" y="482" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">openai/gpt-oss-120b</text>
  <text x="540" y="482" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">profile6</text>
  <text x="630" y="482" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">vLLM-0.24.0-benchmark</text>
  <text x="760" y="482" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">aansharm</text>
  <text x="876" y="482" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#15803d">add 1 row</text>

  <rect x="260" y="510" width="680" height="26" rx="5" fill="#eef2f7"/>
  <text x="268" y="527" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" fill="#475569">Rows before 1,284 &#8594; after 1,284 &#183; 6 affected &#183; Backup: staging/rhaiis-dashboard/backups/consolidated_dashboard-20261103T102233Z.csv</text>

  <!-- Bottom buttons -->
  <rect x="780" y="566" width="64" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="812" y="583" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" fill="#334155">Cancel</text>
  <rect x="850" y="566" width="106" height="26" rx="6" fill="#1d4ed8"/>
  <text x="903" y="583" text-anchor="middle" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Apply changes</text>
  <text x="244" y="583" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="8.5" fill="#94a3b8">Every apply writes a backup first. Delete requires typed confirmation.</text>
</svg>
