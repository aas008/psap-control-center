  <text x="260" y="312" font-family="Red Hat Text, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#475569">MLflow run</text>
  <text x="370" y="312" font-family="Menlo, Consolas, monospace" font-size="10" fill="#0f172a">a1b2c3d4e5f60718293a4b5c6d7e8f90</text>

