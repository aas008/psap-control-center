<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" role="img" aria-labelledby="detailTitle detailDesc">
  <title id="detailTitle">Job detail push confirmation wireframe</title>
  <desc id="detailDesc">A Succeeded RHAIIS job in the Control Center Fournos Dashboard shows a Push to Staging Dashboard action. The confirmation panel shows the dashboard UUID, MLflow run, target S3 key, row preview, and a backup note.</desc>
